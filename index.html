<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Websim Blocky Platformer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #87CEEB; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #overlay { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); font-size: 18px; font-weight: bold; }
        #joystick-container { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; pointer-events: auto; }
        #jump-button { 
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; 
            background: rgba(255,255,255,0.3); border-radius: 50%; border: 4px solid white;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;
            pointer-events: auto; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #jump-button:active { background: rgba(255,255,255,0.5); }
        .player-label {
            position: absolute; background: rgba(0,0,0,0.5); color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 12px; pointer-events: none; transform: translate(-50%, -100%);
            white-space: nowrap;
        }
        canvas { display: block; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.160.0",
        "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
        "cannon-es": "https://esm.sh/cannon-es@0.20.0",
        "nipplejs": "https://esm.sh/nipplejs@0.10.1"
      }
    }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="overlay">
            Players Online: <span id="player-count">1</span><br>
            WASD to Move | Space to Jump
        </div>
        <div id="joystick-container"></div>
        <div id="jump-button" style="display: none;">JUMP</div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
